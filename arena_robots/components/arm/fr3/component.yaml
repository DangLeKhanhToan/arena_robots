xacro:
  include: "$(find arena_robots)/components/arm/fr3/fr3_arm.urdf.xacro"
  macro: fr3_arm_mount
  attach:
    tf_prefix: "${prefix}${mount}_"
    parent: "${prefix}${parent}"

frames:
  tip: "${prefix}${mount}_fr3_link8"

ros2_control:
  joints:
    - name: "${prefix}${mount}_fr3_joint1"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_fr3_joint2"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_fr3_joint3"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_fr3_joint4"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_fr3_joint5"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_fr3_joint6"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_fr3_joint7"
      command_interfaces: [position]
      state_interfaces: [position, velocity]

control:
  controller: "${mount}_controller"
  type: joint_trajectory_controller/JointTrajectoryController
  ros__parameters:
    joints:
      - "${prefix}${mount}_fr3_joint1"
      - "${prefix}${mount}_fr3_joint2"
      - "${prefix}${mount}_fr3_joint3"
      - "${prefix}${mount}_fr3_joint4"
      - "${prefix}${mount}_fr3_joint5"
      - "${prefix}${mount}_fr3_joint6"
      - "${prefix}${mount}_fr3_joint7"
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

caps:
  base_link: "${prefix}${parent}"
  tip_link: "${prefix}${mount}_fr3_link8"
  chain:
    - "${prefix}${mount}_fr3_joint1"
    - "${prefix}${mount}_fr3_joint2"
    - "${prefix}${mount}_fr3_joint3"
    - "${prefix}${mount}_fr3_joint4"
    - "${prefix}${mount}_fr3_joint5"
    - "${prefix}${mount}_fr3_joint6"
    - "${prefix}${mount}_fr3_joint7"
  controller: "${mount}_controller"
  workspace:
    type: box
    frame: "${prefix}${parent}"
    min: [0.2, -0.5, 0.2]
    max: [0.7, 0.5, 1.0]
  named_poses:
    stow:
      joints:
        "${prefix}${mount}_fr3_joint1": 0.0
        "${prefix}${mount}_fr3_joint2": -1.5
        "${prefix}${mount}_fr3_joint3": 0.0
        "${prefix}${mount}_fr3_joint4": -2.9
        "${prefix}${mount}_fr3_joint5": 0.0
        "${prefix}${mount}_fr3_joint6": 1.4
        "${prefix}${mount}_fr3_joint7": 0.785
    ready:
      joints:
        "${prefix}${mount}_fr3_joint1": 0.0
        "${prefix}${mount}_fr3_joint2": -0.785
        "${prefix}${mount}_fr3_joint3": 0.0
        "${prefix}${mount}_fr3_joint4": -2.356
        "${prefix}${mount}_fr3_joint5": 0.0
        "${prefix}${mount}_fr3_joint6": 1.571
        "${prefix}${mount}_fr3_joint7": 0.785
power:
  static_power_w: 50.0
