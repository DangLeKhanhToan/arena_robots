prefix: ""
mounts:
  base_slot:
    parent: chassis_link
    xyz: [0.10, 0, 0.07]
    rpy: [0, 0, 0]
    accepts: [lidar]
    frame: lidar
  torso_panel:
    parent: body_link
    xyz: [0.04, 0, 0.52]
    rpy: [0, 0.6, 0]
    accepts: [camera]
    frame: depth_camera
  screen_top:
    parent: head_link
    xyz: [0.02, 0, 0.09]
    rpy: [0, 0.5, 0]
    accepts: [camera]
    frame: head_camera
  imu:
    parent: chassis_link
    xyz: [0, 0, 0.02]
    rpy: [0, 0, 0]
    accepts: [imu]
defaults:
  lidar:
    - variant: arena_default
      mount: base_slot
      params: {min_angle: -2.0, max_angle: 2.0, samples: 459}
  camera:
    - variant: oakd_rgbd
      mount: torso_panel
    - variant: d435_color
      mount: screen_top
  imu:
    - variant: arena_default
      mount: imu
