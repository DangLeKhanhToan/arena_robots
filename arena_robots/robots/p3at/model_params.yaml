robot_model: p3at
base_frame: base_link
z_offset: 0.111
mass:
  base_kg: 12.7
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: lidar
    sensor: gpu_lidar
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: lidar
    sensor: gpu_lidar
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_link
    sensor: imu_sensor
control:
  mode: ros2_control
  config: package://arena_robots/robots/p3at/control.yaml
  controllers:
    - joint_state_broadcaster
    - p3at_velocity_controller
  cmd_vel_topic: p3at_velocity_controller/cmd_vel
  odom_topic: p3at_velocity_controller/odom
