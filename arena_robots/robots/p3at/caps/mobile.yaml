odom_frame: odom
sensor_frame: lidar
radius: 0.36
is_holonomic: false

footprint: [[0.26, 0.25], [0.26, -0.25], [-0.26, -0.25], [-0.26, 0.25]]

polygons_dict:
  StopPolygon:
    type: polygon
    points: [[0.3, 0.28], [0.3, -0.28], [-0.3, -0.28], [-0.3, 0.28]]
    action_type: stop
    min_points: 4
    visualize: true
    polygon_pub_topic: polygon_stop
    enabled: true

velocity_limits:
  linear: [-0.7, 0.7]
  angular: [-2.0, 2.0]
acceleration_limits:
  linear: 1.5
  angular: 3.0

planar:
  velocity: {linear: [-0.7, 0.7], lateral: [0.0, 0.0], angular: [-2.0, 2.0]}
  acceleration: {linear: 1.5, lateral: .inf, angular: 3.0}
  gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
  lag: 0.0
  traction: 5.9
  pivot: 0.0
  timeout: 0.25

actions:
  continuous:
    linear:
      min: -0.7
      max: 0.7
    angular:
      min: -2.0
      max: 2.0
  discrete:
    - angular: 0.0
      linear: 0.3
      name: move_forward
    - angular: 0.0
      linear: -0.15
      name: move_backward
    - angular: 0.35
      linear: 0.15
      name: turn_left
    - angular: -0.35
      linear: 0.15
      name: turn_right
    - angular: 0.75
      linear: 0.0
      name: turn_strong_left
    - angular: -0.75
      linear: 0.0
      name: turn_strong_right
    - angular: 0.0
      linear: 0.0
      name: stop

laser:
  angle:
    increment: 0.00872664626
    max: 3.14159
    min: -3.14159
  num_beams: 720
  range: 30.0
  update_rate: 10
